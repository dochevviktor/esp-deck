external_components:
  - source:
      type: local
      path: ../components
    components: [stream_deck]

stream_deck:
  id: deck
  initial_brightness: 30
  connected:
    name: Stream Deck USB ready
  errors:
    name: USB errors
  input_overflows:
    name: Input queue overflows
  input_queue_high_water:
    name: Input queue high water
  internal_free_heap:
    name: Internal free heap
    unit_of_measurement: B
  internal_minimum_free_heap:
    name: Internal minimum free heap
    unit_of_measurement: B

number:
  - platform: stream_deck
    stream_deck_id: deck
    id: deck_brightness
    name: Stream Deck brightness
    mode: slider

binary_sensor:
  - platform: stream_deck
    stream_deck_id: deck
    key: 0
    name: Key 0
  - platform: stream_deck
    stream_deck_id: deck
    key: 1
    name: Key 1
