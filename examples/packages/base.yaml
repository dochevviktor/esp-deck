substitutions:
  device_name: streamdeck-original
  friendly_name: Stream Deck Original
  build_dir: .esphome/build/${device_name}

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  build_path: ${build_dir}

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.5.5
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG: "n"
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0
  baud_rate: 115200
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key
  batch_delay: 0ms
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

button:
  - platform: restart
    name: Restart controller
    entity_category: diagnostic
