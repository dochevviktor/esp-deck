name: Software and firmware validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          SANITIZE: '1'
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - run: python tools/package_release.py --check
      - run: python tools/package_release.py
      - name: Pinned Hassfest and upstream HACS schemas
        run: python tools/check_distribution.py --runtime docker

  ha-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Stage isolated HA engine tests
        run: |
          mkdir -p .build/ha-engine
          python -c 'from tools.package_release import archive_bytes, extract_new; extract_new(archive_bytes(), ".build/ha-engine/custom_components/esp_deck")'
          cp -R tests/ha .build/ha-engine/tests
          cp -R examples/home_assistant .build/ha-engine/examples
      - name: Test backend in pinned HA 2026.10.1
        run: |
          # Match the owner of the private (0700) extracted integration directory.
          docker run --rm --cap-drop=all --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e PIP_NO_CACHE_DIR=1 \
            -v "$PWD/.build/ha-engine:/tests" --entrypoint sh \
            ghcr.io/home-assistant/home-assistant:2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0 \
            -c 'python -m venv --system-site-packages /tests/venv && /tests/venv/bin/pip install --no-deps -r /tests/tests/requirements.txt && cd /tests && /tests/venv/bin/python -m pytest -q /tests/tests'

  editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix frontend
      - run: npm test --prefix frontend

  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [01_usb_probe, 02_keys_brightness, 03_images_home_assistant, 04_hardware_test, 05_home_assistant_runtime, renderer_probe, asset_loader_probe]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python tools/check_firmware.py --compile --example ${{ matrix.example }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
