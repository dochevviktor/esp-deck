name: Firmware validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          SANITIZE: '1'

  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [01_usb_probe, 02_keys_brightness, 03_images_home_assistant, 04_hardware_test, 05_home_assistant_runtime, renderer_probe, asset_loader_probe]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python tools/check_firmware.py --compile --example ${{ matrix.example }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
