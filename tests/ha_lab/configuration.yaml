# Isolated, synthetic P5 configuration. No discovery of LAN devices.
homeassistant:
  name: ESP Deck Lab
  internal_url: http://ha:8123
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
  time_zone: UTC
frontend:
http:
api:
websocket_api:
config:
system_health:
history:
logbook:
recorder:
  purge_keep_days: 1
logger:
  default: warning
script: !include scripts.yaml
automation: !include automations.yaml
input_boolean:
  lab_lamp:
    name: Lab lamp state
    initial: false
template:
  - light:
      - name: Example Lamp
        unique_id: esp_deck_lab_lamp
        state: "{{ is_state('input_boolean.lab_lamp', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.lab_lamp
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.lab_lamp
scene:
  - name: Lab On
    entities:
      light.example_lamp: "on"
  - name: Lab Off
    entities:
      light.example_lamp: "off"
